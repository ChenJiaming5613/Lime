// ShaderMake config for the built-in engine shaders.
//
// Syntax: <path relative to this file> -T <vs|ps|gs|hs|ds|cs|ms|as> [-E <entry>]
//         [-D <MACRO>[={a,b,c}]] [-o <subdir>] [-s <suffix>] [-m <X_Y>] [-O <0..3>]
//
// Braces expand into every permutation. Shaders with defines are packed into a single blob
// file; shaders without defines are emitted as raw bytecode. Entry points other than "main"
// are appended to the output file name.

ImGui/ImGui.hlsl -T vs -E MainVS
ImGui/ImGui.hlsl -T ps -E MainPS

Passes/BlinnPhong.hlsl -T vs -E MainVS
Passes/BlinnPhong.hlsl -T ps -E MainPS

// Depth only, so there is no pixel shader entry to compile.
Passes/ShadowDepth.hlsl -T vs -E MainVS

Passes/PostProcess.hlsl -T vs -E MainVS
Passes/PostProcess.hlsl -T ps -E MainPS

Passes/DebugVisualize.hlsl -T vs -E MainVS
Passes/DebugVisualize.hlsl -T ps -E MainPS

Passes/Skybox.hlsl -T vs -E MainVS
Passes/Skybox.hlsl -T ps -E MainPS
