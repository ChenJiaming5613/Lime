# pytest configuration for the Python test suites.
#
# Kept here rather than in the repository root so the Python and C++ test setups stay independent.
# The suites live in subdirectories by subject, currently only Automation.

[pytest]
testpaths = Automation
python_files = test_*.py
addopts =
	--strict-markers
	--tb=short
	-ra

markers =
	editor: requires the editor UI to be running
	slow: launches an extra engine process
